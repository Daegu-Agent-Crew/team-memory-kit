name: Verify

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
      - name: Run tests
        run: |
          chmod +x bin/memory-* tests/*.sh setup
          tests/run.sh
